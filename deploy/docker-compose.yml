version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: merlin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: merlin
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Do NOT publish Postgres to the host to avoid colliding with existing DB services.
    # Containers in this compose can reach Postgres via the service name 'postgres'.

  ml:
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: merlin_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  api:
    image: node:20-alpine
    container_name: merlin_api
    restart: unless-stopped
    working_dir: /usr/src/app
    volumes:
      - ../apps/api:/usr/src/app:cached
      - api_node_modules:/usr/src/app/node_modules
      - ./api.env:/usr/src/app/.env:ro
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
      - ml
    command: sh -c "if [ ! -d node_modules ]; then npm ci --production; fi; if [ ! -d dist ]; then npm run build; fi; npx pm2-runtime start ecosystem.config.js --env production"

  web:
    image: nginx:alpine
    container_name: merlin_web
    restart: unless-stopped
    # Bind to a non-conflicting host port so existing host nginx is not affected.
    # Bind to a distinct public host port so MERLIN is completely separate
    # from the existing site (do not map to 80/443).
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
